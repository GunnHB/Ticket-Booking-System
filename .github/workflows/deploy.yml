name: Deply to Local VM (Self-Hosted) 

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Restart Docker Compose
      run: |
        docker compose down
        docker compose up -d --build
